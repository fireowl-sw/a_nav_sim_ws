# ========================================
# FishBot ROS2 控制器配置文件
# 机器人类型：差分驱动移动机器人
# 应用场景：室内导航和SLAM建图
# 
# 机器人物理参数:
# - 底盘：圆柱形，直径0.24m，高0.12m，重1kg
# - 轮子：左右各一个，直径0.064m，宽0.04m，重0.1kg
# - 轮距：0.2m (左右轮中心距离)
# - 轮径：0.032m (轮子半径)
# ========================================

# ========================================
# 控制器管理器配置
# 负责管理和协调所有控制器的运行
# ========================================
controller_manager:
  ros__parameters:
    # 控制器更新频率 (Hz)
    # 100Hz: 高频控制，确保平滑运动
    # 对于小型室内机器人，100Hz是最佳选择
    # 计算依据: 控制周期 = 1/100 = 0.01s，足够处理快速运动
    update_rate: 100  
    
    # 使用仿真时间 (true/false)
    # true: 在Gazebo仿真环境中使用
    # false: 在真实机器人上使用系统时间
    use_sim_time: true
    
    # ========================================
    # 已启用的控制器列表
    # ========================================
    
    # 关节状态广播器 (必需)
    # 类型: joint_state_broadcaster/JointStateBroadcaster
    # 功能: 将所有关节的状态信息(位置、速度、力矩)发布到/joint_states话题
    # 用途: RViz可视化、状态监控、其他控制器的输入
    # 重要性: ★★★★★ (几乎所有机器人都需要)
    fishbot_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      use_sim_time: true
    

    
    # 差分驱动控制器 (主要运动控制器)
    # 类型: diff_drive_controller/DiffDriveController
    # 功能: 将线速度和角速度命令转换为左右轮速度
    # 输入: /cmd_vel (geometry_msgs/Twist)
    # 输出: 左右轮速度命令、里程计信息、TF变换
    # 重要性: ★★★★★ (差分驱动机器人必需)
    fishbot_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ========================================
# 差分驱动控制器详细参数
# 核心运动控制，将 Twist 命令转换为轮子速度
# ========================================
fishbot_diff_drive_controller:
  ros__parameters:
    # ========================================
    # 轮子关节名称配置
    # ========================================
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    # ========================================
    # 机器人物理参数 (来自URDF文件)
    # ========================================
    # 轮距: 左右轮中心之间的距离 (m)
    # 实际测量值: 0.2m = 20cm
    # 影响因素: 转弯半径、运动学计算精度
    wheel_separation: 0.2
    
    # 轮子半径: 轮子的实际半径 (m)
    # 实际测量值: 0.032m = 3.2cm (直径6.4cm)
    # 影响因素: 线速度到角速度的转换精度
    wheel_radius: 0.032
    
    # 校准系数 (用于参数微调)
    # 用途: 补偿制造误差、磨损、轮胎变形等
    wheel_separation_multiplier: 1.0      # 轮距校准系数
    left_wheel_radius_multiplier: 1.0     # 左轮半径校准系数
    right_wheel_radius_multiplier: 1.0    # 右轮半径校准系数
    
    # ========================================
    # 运动学限制参数
    # 基于机器人物理特性和安全要求设定
    # ========================================
    # 最大线速度 (m/s)
    # 0.5m/s: 适合室内环境的舒适速度
    # 理论计算: wheel_radius * max_wheel_velocity = 0.032 * 15.6 = 0.5m/s
    # 安全考虑: 室内环境人员安全、避障反应时间
    max_linear_velocity: 0.5
    
    # 最大角速度 (rad/s)  
    # 1.0rad/s: 约57度/秒，快速但可控的转向
    # 理论计算: max_linear_velocity / (wheel_separation/2) = 0.5 / 0.1 = 5.0rad/s
    # 实际设定: 1.0rad/s (更保守，确保稳定性)
    max_angular_velocity: 1.0
    
    # 线加速度限制 (m/s²)
    # 0.5m/s²: 平滑的加速过程，避免打滑和倾倒
    # 计算依据: 从0到最大速度需要1秒 (0.5/0.5 = 1s)
    # 安全考虑: 室内地面摩擦系数、机器人稳定性
    max_linear_acceleration: 0.5
    
    # 角加速度限制 (rad/s²)
    # 1.0rad/s²: 平滑的转向过程，避免急转弯
    # 计算依据: 从0到最大角速度需要1秒 (1.0/1.0 = 1s)
    # 安全考虑: 防止机器人倾倒、保持传感器稳定
    max_angular_acceleration: 1.0
    
    # ========================================
    # 里程计和发布参数
    # ========================================
    # 状态发布频率 (Hz)
    # 50Hz: 足够的里程计更新频率，平衡精度和性能
    # 计算依据: 机器人最高速度0.5m/s，50Hz更新 => 每次更新移动1cm
    # 性能考虑: CPU负载、网络带宽、导航算法需求
    publish_rate: 50.0
    
    # 坐标系配置
    odom_frame_id: odom           # 里程计坐标系 (世界坐标系下的机器人位置)
    base_frame_id: base_footprint  # 机器人基座坐标系 (地面投影点)
    
    # ========================================
    # 里程计协方差矩阵
    # 表示里程计测量的不确定性，数值越大表示测量越不准确
    # 基于传感器精度和运动模型误差设定
    # ========================================
    # 位置协方差 [x, y, z, roll, pitch, yaw]
    # x, y: 0.001m² (标准差约3.2cm，适合室内轮式里程计)
    # z: 0.0 (二维平面运动，不考虑高度变化)
    # roll, pitch: 0.0 (假设机器人在水平面上运动)
    # yaw: 0.01rad² (标准差约5.7度，考虑转向累积误差)
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    
    # 速度协方差 [vx, vy, vz, vroll, vpitch, vyaw]
    # vx: 0.001 (m/s)² (线速度测量不确定性)
    # vy: 0.0 (理想差分驱动，横向速度为0)
    # vz, vroll, vpitch: 0.0 (二维平面运动)
    # vyaw: 0.01 (rad/s)² (角速度测量不确定性)
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    
    # ========================================
    # 控制模式配置
    # ========================================
    # 开环控制模式 (true/false)
    # true: 不使用里程计反馈，直接执行命令
    # false: 使用里程计反馈进行闭环控制
    # 选择依据: 仿真环境中通常使用开环，真实环境建议闭环
    open_loop: true
    
    # 发布里程计TF变换 (true/false)
    # true: 发布 odom -> base_footprint 的TF变换
    # false: 不发布，需要外部提供里程计TF
    # 注意: 导航功能包需要此TF变换
    enable_odom_tf: true
    
    # 命令超时时间 (s)
    # 0.5秒后无新命令则自动停止机器人
    # 安全考虑: 防止命令丢失导致的失控运动
    # 设定依据: 导航算法通常以10-20Hz发布命令，0.5s足够检测异常
    cmd_vel_timeout: 0.5
    
    # 使用时间戳命令 (true/false)
    # true: 使用geometry_msgs/TwistStamped (包含时间戳)
    # false: 使用geometry_msgs/Twist (无时间戳)
    # 选择依据: 简化接口，大多数导航包使用无时间戳版本
    use_stamped_vel: false
    
    # ========================================
    # 高级配置选项 (当前注释掉，按需启用)
    # ========================================
    # 速度限制发布 (true/false)
    # true: 发布受限的速度信息 (实际执行的速度)
    # false: 发布原始命令速度
    # 用途: 调试和监控，验证速度限制是否生效
    # publish_limited_velocity: true
    
    # 速度滚动窗口大小
    # 用于计算平均速度的窗口大小
    # 较大值: 更平滑但响应慢
    # 较小值: 响应快但可能抖动
    # velocity_rolling_window_size: 10
